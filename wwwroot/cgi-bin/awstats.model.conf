#-----------------------------------------------------------------------------
# 1. 日志文件配置 | Log File Configuration
#-----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# LogFile: 日志文件路径
# LogFile: Path to log file
# ----------------------------------------------------------------------------
# 中文:
#   支持通配符，例如: /var/log/apache2/domains/*.log
#   可以使用动态标签 (替换为指定时间前的日期):
#     %YYYY-n  = 4位数年份
#     %YY-n    = 2位数年份
#     %MM-n    = 2位数月份
#     %MO-n    = 3字母月份
#     %DD-n    = 日期
#     %HH-n    = 小时
#   示例: "/var/log/access_log.%YYYY-0%MM-0%DD-0.log"
#   也可以使用管道: "gzip -cd /var/log/apache/access.log.gz |"
#
#   多域名配置方案:
#     方案1 - 多个配置文件 (推荐):
#       为每个域名创建独立配置文件
#       /etc/awstats/awstats.domain1.com.conf
#       /etc/awstats/awstats.domain2.com.conf
#       每个文件设置不同的 LogFile
#
#     方案2 - 通配符 + 自动检测:
#       LogFile="/var/log/apache2/domains/*.log"
#       配合 SiteDomain 使用
#
#     方案3 - 合并日志:
#       如果所有域名日志在同一个文件
#       LogFile="/var/log/apache2/combined.log"
#       HostAliases="domain1.com domain2.com domain3.com"
#
#     方案4 - 批量更新脚本:
#       for domain in domain1.com domain2.com; do
#           awstats.pl -config=$domain -update
#       done
#
# English:
#   Supports wildcards, e.g., /var/log/apache2/domains/*.log
#   Dynamic tags (replaced with date n hours ago):
#     %YYYY-n = 4-digit year
#     %YY-n   = 2-digit year
#     %MM-n   = 2-digit month
#     %MO-n   = 3-letter month
#     %DD-n   = day
#     %HH-n   = hour
#   Example: "/var/log/access_log.%YYYY-0%MM-0%DD-0.log"
#   Pipe support: "gzip -cd /var/log/apache/access.log.gz |"
#
#   Multi-domain options:
#     Option 1 - Multiple config files (recommended):
#       Create separate config for each domain
#       /etc/awstats/awstats.domain1.com.conf
#       /etc/awstats/awstats.domain2.com.conf
#
#     Option 2 - Wildcard + auto-detect:
#       LogFile="/var/log/apache2/domains/*.log"
#
#     Option 3 - Combined log:
#       LogFile="/var/log/apache2/combined.log"
#       HostAliases="domain1.com domain2.com domain3.com"
#
#     Option 4 - Batch update script:
#       for domain in domain1.com domain2.com; do
#           awstats.pl -config=$domain -update
#       done
# ----------------------------------------------------------------------------
LogFile="/var/log/apache2/access.log"

# ----------------------------------------------------------------------------
# LogType: 日志类型 | Log type
# ----------------------------------------------------------------------------
# 中文: W=Web服务器, M=邮件服务器, F=FTP服务器, S=流媒体服务器
# English: W=Web server, M=Mail server, F=FTP server, S=Streaming server
# ----------------------------------------------------------------------------
LogType=W

# ----------------------------------------------------------------------------
# LogFormat: 日志格式 | Log format
# ----------------------------------------------------------------------------
# 中文:
#   1 = Apache/NCSA 组合格式 (Combined) - 推荐，支持浏览器/OS统计
#   2 = IIS W3C Extended Log Format (IIS/ISA 格式)
#   3 = WebStar 原生日志格式
#   4 = Apache/NCSA 通用格式 (Common) - 不支持浏览器/OS统计
#   "自定义" = 使用下面的字段键值定义日志格式字符串
#
# 自定义格式可用的字段键值 (Available field keys for custom format):
#   %host            客户端主机名或IP地址
#   %host_r          接收方主机名或IP地址（邮件日志）
#   %lognamequot     认证用户，带引号格式: "john"
#   %logname         认证用户，不带引号格式: john
#   %time1           日期时间格式: [dd/mon/yyyy:hh:mm:ss +0000]
#   %time2           日期时间格式: yyyy-mm-dd hh:mm:ss
#   %time3           日期时间格式: Mon dd hh:mm:ss 或 Mon dd hh:mm:ss yyyy
#   %time4           日期时间格式: unix时间戳
#   %time5           日期时间格式: yyyy-mm-ddThh:mm:ss
#   %time6           日期时间格式: dd/mm/yyyy, hh:mm:ss
#   %methodurl       方法和URL，带引号: "GET /index.html HTTP/x.x"
#   %methodurlnoprot 方法和URL，不带协议: "GET /index.html"
#   %method          方法: GET
#   %url             URL: /index.html
#   %query           查询字符串
#   %code            返回状态码: 200
#   %bytesd          文档大小（字节）
#   %refererquot     来源页面，带引号: "http://from.com/from.htm"
#   %referer         来源页面，不带引号: http://from.com/from.htm
#   %rqtime          请求时间
#   %uabracket       用户代理，带方括号: [Mozilla/4.0...]
#   %uaquot          用户代理，带引号: "Mozilla/4.0..."
#   %ua              用户代理: Mozilla/4.0_...
#   %gzipin          mod_gzip 压缩输入字节
#   %gzipout         mod_gzip 压缩输出字节和比率
#   %gzipratio       mod_gzip 压缩比率
#   %deflateratio    mod_deflate 压缩比率
#   %email           邮件发送者（邮件日志）
#   %email_r         邮件接收者（邮件日志）
#   %virtualname     Web服务器虚拟主机名
#   %cluster         集群ID（使用logresolvemerge.pl合并时）
#   %extraX          用于构建个性化报告的额外字段
#   %other           其他未使用的字段
#   %otherquot       其他未使用的双引号字段
#
# 字面字符串: 可以使用 "status=%code" 格式匹配日志中的字面字符串
#
# 示例 (Apache combined 格式):
#   LogFormat = "%host %other %logname %time1 %methodurl %code %bytesd %refererquot %uaquot"
#
# English:
#   1 = Apache/NCSA Combined Log Format - Recommended
#   2 = IIS W3C Extended Log Format
#   3 = WebStar native log format
#   4 = Apache/NCSA Common Log Format - Does NOT support browser/OS stats
#   "custom" = Use field keys below to define log format string
#
# Custom format field keys:
#   %host            Client hostname or IP address
#   %host_r          Receiver hostname or IP address (for mail log)
#   %lognamequot     Authenticated login/user with format: "john"
#   %logname         Authenticated login/user with format: john
#   %time1           Date and time: [dd/mon/yyyy:hh:mm:ss +0000]
#   %time2           Date and time: yyyy-mm-dd hh:mm:ss
#   %time3           Date and time: Mon dd hh:mm:ss or Mon dd hh:mm:ss yyyy
#   %time4           Date and time: unix timestamp
#   %time5           Date and time: yyyy-mm-ddThh:mm:ss
#   %time6           Date and time: dd/mm/yyyy, hh:mm:ss
#   %methodurl       Method and URL with format: "GET /index.html HTTP/x.x"
#   %methodurlnoprot Method and URL: "GET /index.html"
#   %method          Method: GET
#   %url             URL only: /index.html
#   %query           Query string
#   %code            Return code status: 200
#   %bytesd          Size of document in bytes
#   %refererquot     Referer page with quotes: "http://from.com/from.htm"
#   %referer         Referer page without quotes: http://from.com/from.htm
#   %rqtime          Request time
#   %uabracket       User agent with brackets: [Mozilla/4.0...]
#   %uaquot          User agent with quotes: "Mozilla/4.0..."
#   %ua              User agent: Mozilla/4.0_...
#   %gzipin          mod_gzip compression input bytes
#   %gzipout         mod_gzip compression output bytes & ratio
#   %gzipratio       mod_gzip compression ratio
#   %deflateratio    mod_deflate compression ratio
#   %email           EMail sender (for mail log)
#   %email_r         EMail receiver (for mail log)
#   %virtualname     Web sever virtual hostname
#   %cluster         Cluster id (when merged by logresolvemerge.pl)
#   %extraX          Extra field for personalized report
#   %other           Another not used field
#   %otherquot       Another not used double quoted field
#
# Literal strings: Use "status=%code" to match literal strings in log
#
# Example (Apache combined format):
#   LogFormat = "%host %other %logname %time1 %methodurl %code %bytesd %refererquot %uaquot"
# ----------------------------------------------------------------------------
LogFormat=1

# ----------------------------------------------------------------------------
# LogSeparator: 日志分隔符 | Log separator
# ----------------------------------------------------------------------------
# 中文: 仅用于自定义格式。支持转义字符: \t (制表符), \| (竖线)
# English: Only for custom format. Supports escape: \t (tab), \| (pipe)
# ----------------------------------------------------------------------------
LogSeparator=" "

#-----------------------------------------------------------------------------
# 2. 网站配置 | Website Configuration
#-----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# SiteDomain: 主域名 | Main domain name
# ----------------------------------------------------------------------------
# 中文: 用于统计的网站域名，支持国际化域名 (IDN)
#       多域名时，为每个域名创建独立配置文件
# English: Domain name to analyze, supports IDN
#       For multiple domains, create separate config files
# ----------------------------------------------------------------------------
SiteDomain="www.example.com"

# ----------------------------------------------------------------------------
# HostAliases: 主机别名 | Host aliases
# ----------------------------------------------------------------------------
# 中文: 其他访问域名或地址，空格分隔，支持正则表达式 REGEX[]
#       这些地址的访问会被合并统计到主域名下
#       示例: "localhost 127.0.0.1 REGEX[mydomain\.(net|org)$]"
# English: Other domain names or addresses, space separated, supports REGEX[]
#          Visits from these will be merged into main domain
#          Example: "localhost 127.0.0.1 REGEX[mydomain\.(net|org)$]"
# ----------------------------------------------------------------------------
HostAliases="localhost 127.0.0.1"

#-----------------------------------------------------------------------------
# 3. 数据存储目录 | Data Storage Directory
#-----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# DirData: 数据目录 | Data directory
# ----------------------------------------------------------------------------
# 中文: AWStats 数据库和临时文件存储目录
#       需要 Web 服务器用户有写入权限 (如果允许从浏览器更新)
#       示例: "/var/lib/awstats", "C:/awstats_data_dir"
# English: Directory for AWStats database and temporary files
#          Requires write permission for web server user (if browser update enabled)
#          Examples: "/var/lib/awstats", "C:/awstats_data_dir"
# ----------------------------------------------------------------------------
DirData="."

# ----------------------------------------------------------------------------
# DirCgi: CGI 目录 | CGI directory
# ----------------------------------------------------------------------------
# 中文: awstats.pl 的 Web 访问路径，用于生成报告中的链接
#       示例: "/awstats", "/cgi-bin"
# English: Web URL path to awstats.pl, used to generate links in reports
#          Examples: "/awstats", "/cgi-bin"
# ----------------------------------------------------------------------------
DirCgi="/cgi-bin"

# ----------------------------------------------------------------------------
# DirIcons: 图标目录 | Icons directory
# ----------------------------------------------------------------------------
# 中文: 图标文件的 Web 访问路径
#       示例: "/awstats/icon", "/icon"
# English: Web URL path to icon files
#          Examples: "/awstats/icon", "/icon"
# ----------------------------------------------------------------------------
DirIcons="/icon"

#-----------------------------------------------------------------------------
# 4. 更新设置 | Update Settings
#-----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# AllowToUpdateStatsFromBrowser: 允许从浏览器更新
# AllowToUpdateStatsFromBrowser: Allow updating from browser
# ----------------------------------------------------------------------------
# 中文: 0=否(推荐), 1=是
#       建议使用 cron/任务计划自动更新，而非浏览器
#       如果启用，确保 DirData 对 Web 服务器用户可写
# English: 0=No (recommended), 1=Yes
#          Use cron/task scheduler instead of browser
#          If enabled, ensure DirData is writable by web server user
# ----------------------------------------------------------------------------
AllowToUpdateStatsFromBrowser=0

# ----------------------------------------------------------------------------
# AllowFullYearView: 允许完整年度视图
# AllowFullYearView: Allow full year view
# ----------------------------------------------------------------------------
# 中文:
#   0 = 从不允许
#   1 = 仅命令行允许
#   2 = 仅命令行允许，CGI显示但不允许
#   3 = 命令行和CGI都允许
# English:
#   0 = Never allowed
#   1 = CLI only allowed
#   2 = CLI only allowed, CGI shows but not allowed
#   3 = Both CLI and CGI allowed
# ----------------------------------------------------------------------------
AllowFullYearView=2

# ----------------------------------------------------------------------------
# EnableLockForUpdate: 启用更新锁 | Enable update lock
# ----------------------------------------------------------------------------
# 中文: 防止并发更新。如果进程被强制终止，可能需要手动删除锁文件
#       建议启用
# English: Prevents concurrent updates. If process is killed, may need manual cleanup
#          Recommended to enable
# ----------------------------------------------------------------------------
EnableLockForUpdate=1

# ----------------------------------------------------------------------------
# DNSLookup: DNS 反向解析 | DNS reverse lookup
# ----------------------------------------------------------------------------
# 中文:
#   0 = 不解析
#   1 = 完全解析 (会降低速度)
#   2 = 仅使用静态缓存 (推荐)
# English:
#   0 = No DNS lookup
#   1 = Full DNS lookup (slower)
#   2 = Use static cache only (recommended)
# ----------------------------------------------------------------------------
DNSLookup=2

# ----------------------------------------------------------------------------
# DynamicDNSLookup: 动态 DNS 解析 | Dynamic DNS lookup
# ----------------------------------------------------------------------------
# 中文: 在生成报告时动态解析主机名，而不是在日志分析时
#       0=禁用, 1=启用, 2=启用并使用缓存
# English: Resolve hostnames dynamically when generating reports
#          0=Disabled, 1=Enabled, 2=Enabled with cache
# ----------------------------------------------------------------------------
DynamicDNSLookup=0

# ----------------------------------------------------------------------------
# DNSStaticCacheFile: DNS 静态缓存文件 | DNS static cache file
# ----------------------------------------------------------------------------
# 中文: 手动创建的 DNS 缓存文件，AWStats 不会修改此文件
#       格式: 'ipaddress resolved_hostname' 或 'timestamp ipaddress hostname'
# English: Manually created DNS cache file, AWStats never modifies it
#          Format: 'ipaddress resolved_hostname' or 'timestamp ipaddress hostname'
# ----------------------------------------------------------------------------
DNSStaticCacheFile="dnscache.txt"

# ----------------------------------------------------------------------------
# DNSLastUpdateCacheFile: DNS 更新缓存文件 | DNS update cache file
# ----------------------------------------------------------------------------
# 中文: AWStats 自动维护的 DNS 缓存文件，每次更新时重建
# English: Automatically maintained DNS cache file, rebuilt on each update
# ----------------------------------------------------------------------------
DNSLastUpdateCacheFile="dnscachelastupdate.txt"

# ----------------------------------------------------------------------------
# SkipDNSLookupFor: 跳过 DNS 查询的 IP 地址 | IPs to skip DNS lookup
# ----------------------------------------------------------------------------
# 中文: 对这些 IP 不进行 DNS 反向解析，提高性能
#       支持正则表达式 REGEX[]
#       示例: "127.0.0.1 REGEX[^192\.168\.]"
# English: Skip DNS reverse lookup for these IPs, improves performance
#          Supports REGEX[]
#          Example: "127.0.0.1 REGEX[^192\.168\.]"
# ----------------------------------------------------------------------------
SkipDNSLookupFor=""

#-----------------------------------------------------------------------------
# 5. 访问控制 | Access Control
#-----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# AllowAccessFromWebToAuthenticatedUsersOnly: 仅允许认证用户访问
# AllowAccessFromWebToAuthenticatedUsersOnly: Restrict to authenticated users
# ----------------------------------------------------------------------------
# 中文: 0=否, 1=是 (需要 Web 服务器认证)
#       配合 .htaccess 或 IIS 认证使用
# English: 0=No, 1=Yes (requires web server authentication)
#          Use with .htaccess or IIS authentication
# ----------------------------------------------------------------------------
AllowAccessFromWebToAuthenticatedUsersOnly=0

# ----------------------------------------------------------------------------
# AllowAccessFromWebToFollowingAuthenticatedUsers: 允许的认证用户列表
# AllowAccessFromWebToFollowingAuthenticatedUsers: Allowed authenticated users
# ----------------------------------------------------------------------------
# 中文: 允许访问的用户列表，空格分隔
#       可以使用 __REMOTE_USER__ 自动获取当前用户
# English: List of allowed users, space separated
#          Use __REMOTE_USER__ for current authenticated user
# ----------------------------------------------------------------------------
AllowAccessFromWebToFollowingAuthenticatedUsers=""

# ----------------------------------------------------------------------------
# AllowAccessFromWebToFollowingIPAddresses: 允许的 IP 地址列表
# AllowAccessFromWebToFollowingIPAddresses: Allowed IP addresses
# ----------------------------------------------------------------------------
# 中文: 允许访问的 IP 地址或范围，空格分隔
#       示例: "127.0.0.1 123.123.123.1-123.123.123.255"
# English: Allowed IP addresses or ranges, space separated
#          Example: "127.0.0.1 123.123.123.1-123.123.123.255"
# ----------------------------------------------------------------------------
AllowAccessFromWebToFollowingIPAddresses=""

#-----------------------------------------------------------------------------
# 6. 数据处理选项 | Data Processing Options
#-----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# CreateDirDataIfNotExists: 自动创建数据目录
# CreateDirDataIfNotExists: Auto-create data directory
# ----------------------------------------------------------------------------
# 中文: 0=否, 1=是 (适用于虚拟主机环境)
# English: 0=No, 1=Yes (useful for virtual hosting)
# ----------------------------------------------------------------------------
CreateDirDataIfNotExists=0

# ----------------------------------------------------------------------------
# BuildHistoryFormat: 历史数据格式 | History data format
# ----------------------------------------------------------------------------
# 中文: text=文本格式 (推荐), xml=XML格式 (文件更大)
# English: text=Text format (recommended), xml=XML format (larger files)
# ----------------------------------------------------------------------------
BuildHistoryFormat=text

# ----------------------------------------------------------------------------
# BuildReportFormat: 报告格式 | Report format
# ----------------------------------------------------------------------------
# 中文: html=HTML, xhtml=XHTML (某些浏览器可能不支持)
# English: html=HTML, xhtml=XHTML (may not work with old browsers)
# ----------------------------------------------------------------------------
BuildReportFormat=html

# ----------------------------------------------------------------------------
# SaveDatabaseFilesWithPermissionsForEveryone: 数据库文件权限
# SaveDatabaseFilesWithPermissionsForEveryone: Database file permissions
# ----------------------------------------------------------------------------
# 中文: 0=默认权限, 1=所有人可读写 (用于解决权限问题)
# English: 0=Default permissions, 1=Read/write for everyone (solves permission issues)
# ----------------------------------------------------------------------------
SaveDatabaseFilesWithPermissionsForEveryone=0

# ----------------------------------------------------------------------------
# PurgeLogFile: 清理日志文件 | Purge log file
# ----------------------------------------------------------------------------
# 中文: 0=否, 1=处理后删除日志 (不适用于 IIS)
# English: 0=No, 1=Delete log file after processing (not for IIS)
# ----------------------------------------------------------------------------
PurgeLogFile=0

# ----------------------------------------------------------------------------
# ArchiveLogRecords: 归档日志记录 | Archive log records
# ----------------------------------------------------------------------------
# 中文: 0=否, 1=是，或使用动态标签命名归档文件
#       示例: %YYYY%MM%DD
# English: 0=No, 1=Yes, or use dynamic tags for archive filename
#          Example: %YYYY%MM%DD
# ----------------------------------------------------------------------------
ArchiveLogRecords=0

# ----------------------------------------------------------------------------
# KeepBackupOfHistoricFiles: 保留历史文件备份
# KeepBackupOfHistoricFiles: Keep backup of historic files
# ----------------------------------------------------------------------------
# 中文: 0=否, 1=是 (推荐)
# English: 0=No, 1=Yes (recommended)
# ----------------------------------------------------------------------------
KeepBackupOfHistoricFiles=1

#-----------------------------------------------------------------------------
# 7. 文件过滤 | File Filtering
#-----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# DefaultFile: 默认首页文件 | Default index files
# ----------------------------------------------------------------------------
# 中文: 按优先级排序，空格分隔
#       示例: "index.php index.html default.html"
# English: Priority order, space separated
#          Example: "index.php index.html default.html"
# ----------------------------------------------------------------------------
DefaultFile="index.php index.html"

# ----------------------------------------------------------------------------
# SkipHosts: 跳过的主机 | Hosts to skip
# ----------------------------------------------------------------------------
# 中文: 不统计这些 IP/主机名，支持正则表达式 REGEX[]
#       示例: "127.0.0.1 localhost REGEX[^192\.168\.]"
# English: Don't count these IPs/hostnames, supports REGEX[]
#          Example: "127.0.0.1 localhost REGEX[^192\.168\.]"
# ----------------------------------------------------------------------------
SkipHosts=""

# ----------------------------------------------------------------------------
# SkipUserAgents: 跳过的 User-Agent | User-Agents to skip
# ----------------------------------------------------------------------------
# 中文: 不统计这些浏览器/爬虫，支持正则表达式
#       排除机器人请修改 robots.pm 文件
# English: Skip these browsers/crawlers, supports regex
#          To exclude robots, modify robots.pm file instead
# ----------------------------------------------------------------------------
SkipUserAgents=""

# ----------------------------------------------------------------------------
# SkipFiles: 跳过的文件 | Files to skip
# ----------------------------------------------------------------------------
# 中文: 不统计这些 URL，支持正则表达式
#       示例: "/badpage.php REGEX[^\/excludedirectory]"
# English: Skip these URLs, supports regex
#          Example: "/badpage.php REGEX[^\/excludedirectory]"
# ----------------------------------------------------------------------------
SkipFiles=""

# ----------------------------------------------------------------------------
# SkipReferrersBlackList: 跳过的 Referrer 黑名单
# SkipReferrersBlackList: Referrer blacklist file
# ----------------------------------------------------------------------------
# 中文: 排除垃圾 Referrer，指定黑名单文件路径
#       警告: 会显著降低处理速度 (5倍)
# English: Exclude spam referrers, specify blacklist file path
#          Warning: Significantly slows down processing (5x)
# ----------------------------------------------------------------------------
SkipReferrersBlackList=""

# ----------------------------------------------------------------------------
# OnlyHosts: 仅统计的主机 | Only count these hosts
# ----------------------------------------------------------------------------
# 中文: 白名单，只统计这些 IP/主机名
# English: Whitelist, only count these IPs/hostnames
# ----------------------------------------------------------------------------
OnlyHosts=""

# ----------------------------------------------------------------------------
# OnlyUserAgents: 仅统计的 User-Agent | Only count these User-Agents
# ----------------------------------------------------------------------------
OnlyUserAgents=""

# ----------------------------------------------------------------------------
# OnlyUsers: 仅统计的用户 | Only count these users
# ----------------------------------------------------------------------------
OnlyUsers=""

# ----------------------------------------------------------------------------
# OnlyFiles: 仅统计的文件 | Only count these files
# ----------------------------------------------------------------------------
OnlyFiles=""
# ----------------------------------------------------------------------------
# UseDefaultNotPageList: 是否使用默认的静态资源列表
# UseDefaultNotPageList: Whether to use default static resources list
# ----------------------------------------------------------------------------
# 中文: 1=使用默认（推荐），0=使用自定义列表
#       默认列表包含：图片、样式、脚本、字体、音视频等所有静态资源
# English: 1=Use default (recommended), 0=Use custom list below
# ----------------------------------------------------------------------------
UseDefaultNotPageList=1

# ----------------------------------------------------------------------------
# NotPageList: 自定义静态资源扩展名列表（仅当 UseDefaultNotPageList=0 时生效）
# NotPageList: Custom static resources extension list (only when UseDefaultNotPageList=0)
# ----------------------------------------------------------------------------
# 示例 | Example: NotPageList="css js gif jpg png"
NotPageList=""

#-----------------------------------------------------------------------------
# 8. HTTP/SMTP 状态码 | HTTP/SMTP Status Codes
#-----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# ValidHTTPCodes: 有效的 HTTP 状态码 | Valid HTTP status codes
# ----------------------------------------------------------------------------
# 中文: 只统计这些状态码的请求
#       常见: 200(成功), 304(未修改), 302(重定向)
# English: Only count requests with these status codes
#          Common: 200(OK), 304(Not Modified), 302(Redirect)
# ----------------------------------------------------------------------------
ValidHTTPCodes="200 304"

# ----------------------------------------------------------------------------
# ValidSMTPCodes: 有效的 SMTP 状态码 | Valid SMTP status codes
# ----------------------------------------------------------------------------
# 中文: 用于邮件服务器日志分析
# English: For mail server log analysis
# ----------------------------------------------------------------------------
ValidSMTPCodes="1 250"

