#-----------------------------------------------------------------------------
# 20. 自定义图表 (Extra Sections) | Custom Charts (Extra Sections)
#-----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# Extra Section 配置说明 | Extra Section Configuration
# ----------------------------------------------------------------------------
# 中文: 可以定义自定义图表，用于统计产品订单、特定页面等
#       每个 Extra Section 会降低约 8% 的处理速度
# English: Define custom charts for product orders, specific pages, etc.
#          Each Extra Section reduces processing speed by ~8%
# ----------------------------------------------------------------------------
#
# 参数说明 | Parameters:
#   ExtraSectionNameX               - 图表标题 | Chart title
#   ExtraSectionCodeFilterX         - HTTP 状态码过滤 | HTTP status code filter
#   ExtraSectionConditionX          - 条件过滤 | Condition filter
#   ExtraSectionFirstColumnTitleX   - 第一列标题 | First column title
#   ExtraSectionFirstColumnValuesX  - 第一列值提取规则 | First column value extraction
#   ExtraSectionFirstColumnFormatX  - 值格式化 | Value format
#   ExtraSectionStatTypesX          - 统计类型 (P/H/B/L) | Statistics types
#   ExtraSectionAddAverageRowX      - 添加平均行 | Add average row
#   ExtraSectionAddSumRowX          - 添加总和行 | Add sum row
#   MaxNbOfExtraX                   - 最大行数 | Maximum rows
#   MinHitExtraX                    - 最小点击数 | Minimum hits
#
# 示例: 统计产品订单 | Example: Product orders
#
#ExtraSectionName1="Product orders"
#ExtraSectionCodeFilter1="200 304"
#ExtraSectionCondition1="URL,\/cgi\-bin\/order\.cgi"
#ExtraSectionFirstColumnTitle1="Product ID"
#ExtraSectionFirstColumnValues1="QUERY_STRING,productid=([^&]+)"
#ExtraSectionFirstColumnFormat1="%s"
#ExtraSectionStatTypes1=PL
#ExtraSectionAddAverageRow1=0
#ExtraSectionAddSumRow1=1
#MaxNbOfExtra1=20
#MinHitExtra1=1

# ----------------------------------------------------------------------------
# ExtraTrackedRowsLimit: 自定义图表最大行数限制
# ExtraTrackedRowsLimit: Maximum rows for custom charts
# ----------------------------------------------------------------------------
# 中文: 所有 Extra Section 的行数限制，防止内存溢出
# English: Row limit for all Extra Sections, prevents memory overflow
# ----------------------------------------------------------------------------
ExtraTrackedRowsLimit=500

# ----------------------------------------------------------------------------
# DownloadExtList: 下载文件扩展名列表 | Download file extensions
# ----------------------------------------------------------------------------
# 中文: 空格分隔的扩展名列表，这些文件将被统计为下载
# English: Space-separated extension list, these files will be counted as downloads
# ----------------------------------------------------------------------------
DownloadExtList="zip rar 7z tar gz bz2 xz exe msi dmg pkg deb rpm apk ipa pdf doc docx xls xlsx ppt pptx epub mobi iso img torrent"

# ----------------------------------------------------------------------------
# StreamingExtList: 流媒体文件扩展名列表 | Streaming file extensions
# ----------------------------------------------------------------------------
# 中文: 空格分隔的扩展名列表，这些文件将被特殊处理（区分在线播放和下载）
# English: Space-separated extension list, these files get special handling
# ----------------------------------------------------------------------------
StreamingExtList="mp4 webm mkv avi mov wmv flv mp3 m4a ogg wav flac m3u8 ts"

# ----------------------------------------------------------------------------
# TrackStreamingFullDownload: 是否统计流媒体完整下载
# TrackStreamingFullDownload: Whether to track streaming full downloads
# ----------------------------------------------------------------------------
# 中文: 1=统计, 0=不统计（200状态码的流媒体文件）
# English: 1=Track, 0=Don't track (streaming files with 200 status code)
# ----------------------------------------------------------------------------
TrackStreamingFullDownload=1

