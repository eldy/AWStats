#------------------------------------------------------------------------------
# 快速配置指南 | Quick Configuration Guide
#------------------------------------------------------------------------------
#
# 【中文】3 步快速配置:
#   1. 修改 LogFile 为您的 Web 服务器日志路径
#      - Apache (Ubuntu/Debian): /var/log/apache2/access.log
#      - Apache (CentOS/RHEL):   /var/log/httpd/access_log
#      - Nginx:                  /var/log/nginx/access.log
#      - IIS (Windows):          C:\inetpub\logs\LogFiles\W3SVC1\u_ex*.log
#
#   2. 修改 SiteDomain 为您的网站域名
#      - 单域名: SiteDomain="www.example.com"
#      - 多域名: 为每个域名创建独立配置文件
#
#   3. 运行命令更新统计:
#      /usr/lib/cgi-bin/awstats.pl -config=www.example.com -update
#
#   4. (可选) 设置自动更新:
#      # 每天凌晨 1 点更新
#      0 1 * * * /usr/lib/cgi-bin/awstats.pl -config=www.example.com -update
#
# 【English】3-step quick setup:
#   1. Change LogFile to your web server log path
#      - Apache (Ubuntu/Debian): /var/log/apache2/access.log
#      - Apache (CentOS/RHEL):   /var/log/httpd/access_log
#      - Nginx:                  /var/log/nginx/access.log
#
#   2. Change SiteDomain to your website domain
#      - Single domain: SiteDomain="www.example.com"
#      - Multiple domains: Create separate config files
#
#   3. Run update command:
#      /usr/lib/cgi-bin/awstats.pl -config=www.example.com -update
#
#   4. (Optional) Setup automatic updates:
#      # Update daily at 1 AM
#      0 1 * * * /usr/lib/cgi-bin/awstats.pl -config=www.example.com -update
#
#------------------------------------------------------------------------------
# 常见问题 | FAQ
#------------------------------------------------------------------------------
#
# Q: 为什么看不到统计？/ Why can't I see statistics?
# A: 检查以下几点 / Check the following:
#    - 日志文件路径是否正确 / Log file path is correct
#    - 日志文件是否有读取权限 / Log file has read permissions
#    - 数据目录是否有写入权限 / Data directory has write permissions
#    - 运行更新命令时是否报错 / Check if update command shows errors
#    - 使用调试模式: awstats.pl -config=xxx -update -debug
#
# Q: 如何统计多个域名？/ How to analyze multiple domains?
# A: 参考上面的多域名配置方案 / See multi-domain options above
#    - 方案1: 为每个域名创建独立配置文件 (推荐)
#    - 方案2: 使用通配符日志文件
#    - 方案3: 合并日志文件并使用 HostAliases
#    - 方案4: 批量更新脚本
#
# Q: 如何设置自动更新？/ How to setup automatic updates?
# A: Linux 使用 cron / Use cron on Linux:
#    # 编辑 crontab
#    crontab -e
#    # 添加以下行 (每天凌晨 1 点)
#    0 1 * * * /usr/lib/cgi-bin/awstats.pl -config=www.example.com -update
#
#    Windows 使用任务计划程序 / Use Task Scheduler on Windows:
#    schtasks /create /tn "AWStats Update" /tr "perl C:\awstats\awstats.pl -config=xxx -update" /sc daily /st 01:00
#
# Q: 如何启用 GeoIP 地理定位？/ How to enable GeoIP geolocation?
# A: 1. 安装 Geo::IPfree 或 Geo::IP 模块
#       sudo apt-get install libgeo-ipfree-perl   # Debian/Ubuntu
#       sudo yum install perl-Geo-IPfree           # CentOS/RHEL
#    2. 下载 GeoIP 数据库 / Download GeoIP database
#    3. 启用插件 / Enable plugin:
#       LoadPlugin="geoipfree"
#       或 / or: LoadPlugin="geoip GEOIP_STANDARD /path/to/GeoIP.dat"
#
# Q: 如何调试配置问题？/ How to debug configuration issues?
# A: 使用调试模式运行 / Run with debug mode:
#    /usr/lib/cgi-bin/awstats.pl -config=www.example.com -update -debug
#    检查错误日志 / Check error log:
#    tail -f /var/log/awstats/awstats-update.log
#
# Q: 如何提高处理速度？/ How to improve processing speed?
# A: - 禁用不需要的检测 / Disable unnecessary detection
#    - 使用 DNSLookup=2 / Use DNSLookup=2
#    - 减少显示数量限制 / Reduce display limits
#    - 禁用 GeoIP 插件 / Disable GeoIP plugin
#    - 使用 hashfiles 插件 / Use hashfiles plugin
#
#------------------------------------------------------------------------------