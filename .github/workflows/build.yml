            BrandLink="https://your-company.com"   # 点击 Logo 跳转的网址
            BrandPlatform="CloudStack"             # 您的平台名称（建议英文字符）
            StatsUrl="/vstats"                     # AWStats 部署的 Web 路径
            ```

