            ## 🚀 Quick Start

            ### Using HestiaCP (Recommended)
            If you use [Hestia Control Panel](https://hestiacp.com/), AWStats will be configured automatically:
            1. AWStats is automatically enabled when adding a domain
            2. Log path is automatically configured
            3. Scheduled updates are automatically added
            4. Visit `https://your-domain/vstats/` to view statistics

            ## 🔄 Pre-Upgrade Conversion (Only for Upgrading from Older Versions)

            If upgrading the site, please first run `/usr/share/awstats/tools/awstats_convert-zh.pl` to convert the historical data files (*.txt) from format version 7.0-7.9 to 8.1. The script will automatically detect and batch convert all AWStats data files (*.txt) located under the `/home/*/web/*/stats/` directory. Please feel free to run it — it will automatically back up the original files before conversion. If your site is not located under the `home` directory, adjust the path according to this structure: `/home/site_running_username/web/your_domain_name/stats/`. After the conversion is complete, proceed with the data update operation; otherwise, the update will fail due to format incompatibility.

            > **Note**: If your site version is below 7.0, please adjust the script's regex matching parameter `s/AWSTATS DATA FILE 7.[0-9]{1,2}/AWSTATS DATA FILE 8.1/` according to your actual version number.
            >
            > **💡 Tip**: Backup files are by default saved in the directory `/backup/awstats_converter/backup_<timestamp>/`.
            
