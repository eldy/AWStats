            ## 🔄 升级前转换（仅限从旧版升级）

            若涉及站点升级，请先执行 `/usr/share/awstats/tools/awstats_convert-zh.pl` 对历史数据文件（*.txt）进行格式转换（7.0-7.9 → 8.1）。程序将自动检测 `/home/*/web/*/stats/` 目录下的所有 AWStats 数据文件（*.txt）并进行自动批量转换。请放心执行，它将在转换前自动备份原文件。若您的站点不在 `home` 目录下，请参考这个路径结构 `/home/站点运行用户名/web/您的域名/stats/` 微调。转换完成后，再执行数据更新操作，否则将因格式不兼容导致更新失败。
            
            > **注意**：若您的站点版本低于 7.0，请根据实际版本号调整脚本中 `s/AWSTATS DATA FILE 7\.[0-9]{1,2}/AWSTATS DATA FILE 8.1/` 正则表达式的匹配参数。
            >
            > **💡 提示**：备份文件默认保存在 `/backup/awstats_converter/backup_执行时的时间戳命名/` 目录下。
            
