            ### 🚀 品牌化特性

            - **全平台适配**：不论是主流 Linux 发行版、各类操作系统，均能完美显示
            - **视觉一致性**：支持矢量 SVG Logo，确保在各种分辨率（甚至是 Retina 屏）下都能清晰锐利
